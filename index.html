<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WM Pendency Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="description" content="WM Pendency Dashboard — dark store and fleet coach wise training pendency tracker.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="https://disprz.ai/hubfs/Favicon_64%20px%20reverse-final%20(2).png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
<style>
  /* ── Reset & base ───────────────────────────────────────────────────────── */
  *,*::before,*::after{box-sizing:border-box}
  html,body{scrollbar-width:none!important;-ms-overflow-style:none!important}
  ::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
  :root{--primary:#4f46e5;--primary-light:#818cf8;--ink:#1e1b4b;--bg-glass:rgba(255,255,255,.96)}
  body{
    background:linear-gradient(135deg,#c7d2fe 0%,#e0e7ff 40%,#f8fafc 100%);
    margin:0;padding:20px 15px 120px;min-height:100vh;
    font-family:'Segoe UI',system-ui,sans-serif;
    color:var(--ink);
    text-align:center; /* requirement: all text centered */
  }

  /* ── Snowfall canvas (sits behind everything) ───────────────────────────── */
  #snow-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}

  /* ── All content above snow ─────────────────────────────────────────────── */
  .wm-shell{position:relative;z-index:1}
  .wm-shell *{text-align:center}
  .wm-shell{text-transform:capitalize}

  /* ── Nav ────────────────────────────────────────────────────────────────── */
  .top-nav{display:flex;justify-content:center;gap:15px;margin-bottom:25px}
  .btn-nav{background:rgba(255,255,255,.75);border:2px solid #e2e8f0;border-radius:50px;padding:8px 24px;font-weight:800;font-size:14px;cursor:pointer;transition:.3s;color:var(--ink);text-decoration:none;display:inline-block;backdrop-filter:blur(8px)}
  .btn-nav:hover,.btn-nav.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ── Loading overlay ────────────────────────────────────────────────────── */
  #loading-overlay{position:fixed;inset:0;background:rgba(199,210,254,.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.8,0,.2,1);backdrop-filter:blur(8px)}
  .skeleton-box{background:rgba(255,255,255,.7);border-radius:12px;margin-bottom:20px;animation:pulse-bg 1.5s infinite ease-in-out}
  @keyframes pulse-bg{0%{opacity:.4}50%{opacity:1}100%{opacity:.4}}
  .slide-up{transform:translateY(-100%)}
  .spinner{width:50px;height:50px;border:5px solid #fff;border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text-anim{font-weight:800;font-size:18px;letter-spacing:1px;color:var(--primary)}

  /* ── Glass card ─────────────────────────────────────────────────────────── */
  .glass-panel{
    background:var(--bg-glass);border-radius:24px;
    padding:30px 28px 35px;
    box-shadow:0 20px 60px rgba(79,70,229,.15),0 4px 20px rgba(0,0,0,.06);
    width:100%;max-width:900px;
    backdrop-filter:blur(16px);
    border:1.5px solid rgba(255,255,255,.85);
    margin:auto;position:relative;
    text-align:center;
  }

  /* ── Logo (top-left corner of glass panel) ──────────────────────────────── */
  .panel-logo{
    position:absolute;top:18px;left:20px;
    width:52px;height:52px;border-radius:14px;
    object-fit:cover;
    box-shadow:0 4px 12px rgba(79,70,229,.25);
    border:2px solid rgba(79,70,229,.15);
    cursor:pointer;
  }

  /* ── Panel heading ──────────────────────────────────────────────────────── */
  .panel-title{font-weight:900;font-size:22px;margin:0 0 22px;color:var(--ink);letter-spacing:-.3px}

  /* ── Mode tabs ──────────────────────────────────────────────────────────── */
  .tab-container{display:flex;justify-content:center;gap:15px;margin-bottom:25px}
  .btn-mode{border:none;padding:12px 22px;border-radius:12px;font-weight:800;background:#e0e7ff;color:var(--ink);transition:.3s;flex:1;max-width:240px;font-size:14px}
  .btn-mode:hover:not(.mode-active){background:#c7d2fe;transform:translateY(-2px)}
  .mode-active{background:var(--primary)!important;color:#fff!important;box-shadow:0 4px 14px rgba(79,70,229,.35)!important}

  /* ── TomSelect ──────────────────────────────────────────────────────────── */
  .ts-control,.form-select{border-radius:12px!important;padding:13px 14px!important;border:2px solid #e0e7ff!important;background:#fff!important;cursor:pointer;text-align-last:center!important;transition:.3s;text-align:center!important}
  .ts-control.focus,.form-select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(79,70,229,.18)!important;outline:none}
  .ts-control .item,.ts-control input{width:100%!important;font-weight:800;font-size:15px;color:var(--ink)!important;text-align:center!important}
  .ts-dropdown{border-radius:12px!important;border:1px solid #e0e7ff;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:5px}
  .ts-dropdown .option{padding:12px;font-weight:800;border-radius:8px;margin-bottom:2px;color:var(--ink)!important;transition:.2s;text-align:center!important}
  .ts-dropdown .option:hover,.ts-dropdown .active{background:#e0e7ff!important;color:var(--primary)!important}

  /* ── Results ────────────────────────────────────────────────────────────── */
  #resultArea{margin-top:30px;flex-direction:column;align-items:center}
  .badge-pendency{background:var(--primary);color:#fff;padding:12px 32px;border-radius:50px;font-weight:900;margin-bottom:22px;font-size:16px;box-shadow:0 6px 18px rgba(79,70,229,.3);display:inline-block;letter-spacing:.3px}
  .action-buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-bottom:22px;width:100%}
  .btn-action{border:none;padding:12px 26px;border-radius:12px;font-weight:800;font-size:14px;transition:.3s;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,.1)}
  .btn-action:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 8px 16px rgba(0,0,0,.15)}
  .btn-action:disabled{opacity:.45;cursor:not-allowed}
  .btn-pdf{background:var(--primary);color:#fff}
  .btn-sheet{background:#059669;color:#fff}

  /* ── Table ──────────────────────────────────────────────────────────────── */
  .table-responsive{background:#fff;border-radius:14px;overflow:hidden;width:100%;border:1.5px solid #e0e7ff;margin-bottom:16px}
  .table{margin-bottom:0;width:100%;border-collapse:collapse}
  .table thead th{background:#f1f5f9;border-bottom:2px solid #e0e7ff;padding:15px;font-size:13px;font-weight:800;text-align:center}
  .table tbody tr{border-bottom:1px solid #e0e7ff}
  .table tbody tr:hover{background:#f1f5f9!important}
  .table td{padding:16px;font-weight:700;font-size:14px;vertical-align:middle;text-align:center}
  .badge-count{background:var(--primary);color:#fff;padding:7px 0;border-radius:25px;font-size:14px;font-weight:800;min-width:80px;display:inline-block}
  .fc-missing-pill{background:#fee2e2;color:#b91c1c;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;border:1px solid #fca5a5;display:inline-block}

  /* ── Pagination ─────────────────────────────────────────────────────────── */
  .pagination-container{display:flex;justify-content:center;align-items:center;gap:15px;margin:15px 0}
  .btn-page{padding:10px 20px;font-weight:800;border:none;background:#e0e7ff;color:var(--ink);border-radius:10px;cursor:pointer;font-size:13px}
  .btn-page:hover:not(:disabled){background:#c7d2fe}
  .btn-page:disabled{opacity:.4;cursor:not-allowed}

  /* ── Toast ──────────────────────────────────────────────────────────────── */
  #toast-container{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:9999;display:none}
  .toast-msg{background:var(--ink);color:#fff;padding:12px 26px;border-radius:50px;font-weight:800;font-size:14px;box-shadow:0 10px 28px rgba(0,0,0,.28)}

  /* ── AI Panel ───────────────────────────────────────────────────────────── */
  #aiPanel{
    margin-top:22px;text-align:left;
    background:linear-gradient(135deg,rgba(79,70,229,.06),rgba(129,140,248,.06));
    border:1.5px solid rgba(79,70,229,.18);
    border-radius:16px;padding:16px 20px;
    display:none;
  }
  .ai-header{font-weight:900;font-size:12px;letter-spacing:.8px;color:var(--primary);margin-bottom:10px;text-transform:uppercase;display:flex;align-items:center;gap:8px;justify-content:center}
  .ai-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);animation:ai-pulse 1.4s infinite}
  @keyframes ai-pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .ai-chip{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:10px;font-size:12px;font-weight:700;
    margin:4px;text-align:left;
  }
  .ai-warn{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3}
  .ai-good{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
  .ai-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
  .ai-chips-row{display:flex;flex-wrap:wrap;justify-content:center;gap:0}

  /* ── Mascot stand (bottom-right, fixed) ─────────────────────────────────── */
  #mascot-wrap{
    position:fixed;right:0;bottom:0;z-index:50;
    width:160px;
    transform:translateY(100%);
    transition:transform .7s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  #mascot-wrap.show{transform:translateY(0)}
  #mascot-img{width:100%;display:block;cursor:pointer;pointer-events:all}
  #mascot-close{
    position:absolute;top:6px;right:6px;
    width:24px;height:24px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;
    font-size:14px;line-height:24px;text-align:center;
    cursor:pointer;pointer-events:all;
    display:none;
    transition:.2s;
  }
  #mascot-wrap:hover #mascot-close{display:block}
  #mascot-close:hover{background:rgba(239,68,68,.9);transform:scale(1.1)}

  /* ── Mascot reveal button (bottom-right pill) ───────────────────────────── */
  #mascot-btn{
    position:fixed;right:16px;bottom:16px;z-index:51;
    background:var(--primary);color:#fff;border:none;border-radius:50px;
    padding:8px 16px;font-weight:800;font-size:12px;cursor:pointer;
    box-shadow:0 4px 14px rgba(79,70,229,.4);display:none;
    animation:float-btn 2s ease-in-out infinite;
  }
  @keyframes float-btn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* ── Secret panel hint ──────────────────────────────────────────────────── */
  #hint-text{
    font-size:11px;font-weight:700;color:rgba(79,70,229,.45);
    margin-top:6px;letter-spacing:.3px;user-select:none;
    text-align:center;
  }
</style>
</head>

</div>
<button id="mascot-btn" title="Show mascot" onclick="showMascot()">👧 Show</button>

<!-- ── Scripts ────────────────────────────────────────────────────────────── -->
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<script src="wm-shared.js" defer></script>
<script defer>
/* ═══════════════════════════════════════════════════════════════════════════
   WM Pendency Dashboard — index.js (inline)
   ═══════════════════════════════════════════════════════════════════════════ */

const API_URL = "https://script.google.com/macros/s/AKfycbzCApky64d1Texcqaq67XP57rSRULR7RUnsqrYatGTjsHX7AW-ArAN5jO-59nSRFEVy/exec";

// ── State ──────────────────────────────────────────────────────────────────
let db = [], filtered = [], displayArray = [], coachMode = false;
let cityCtrl, storeCtrl;
let currentPage = 1;
const ROWS_PER_PAGE = 50;

/* ────────────────────────────────────────────────────────────────────────────
   ❄️  SNOWFALL
   Canvas-based snow — lightweight, no libraries. Flakes vary in size, speed,
   and opacity to create a natural layered depth effect.
──────────────────────────────────────────────────────────────────────────── */
(function initSnow() {
  const canvas = document.getElementById('snow-canvas');
  const ctx    = canvas.getContext('2d');

  let W, H, flakes = [];
  const COUNT = 90;

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function rnd(min, max) { return Math.random() * (max - min) + min; }

  function mkFlake() {
    return {
      x:     rnd(0, W),
      y:     rnd(-H, 0),
      r:     rnd(2, 5.5),
      speed: rnd(0.6, 2.2),
      drift: rnd(-0.4, 0.4),
      alpha: rnd(0.3, 0.85),
      wobble: rnd(0, Math.PI * 2),
      wobbleSpeed: rnd(0.01, 0.03)
    };
  }

  for (let i = 0; i < COUNT; i++) flakes.push({ ...mkFlake(), y: rnd(0, H) });

  function draw() {
    ctx.clearRect(0, 0, W, H);
    flakes.forEach(f => {
      f.wobble += f.wobbleSpeed;
      f.x      += f.drift + Math.sin(f.wobble) * 0.4;
      f.y      += f.speed;
      if (f.y > H + 10) { Object.assign(f, mkFlake()); f.y = -10; f.x = rnd(0, W); }

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${f.alpha})`;
      ctx.shadowColor = 'rgba(255,255,255,.6)';
      ctx.shadowBlur  = 4;
      ctx.fill();
      ctx.shadowBlur  = 0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ────────────────────────────────────────────────────────────────────────────
   🎭  MASCOT STAND
   Auto-slides up from the bottom-right 2.5 s after page load.
   ✕ closes it and shows a small "Show" pill instead.
──────────────────────────────────────────────────────────────────────────── */
function showMascot() {
  document.getElementById('mascot-wrap').classList.add('show');
  document.getElementById('mascot-btn').style.display = 'none';
}

(function initMascot() {
  const wrap  = document.getElementById('mascot-wrap');
  const close = document.getElementById('mascot-close');
  const btn   = document.getElementById('mascot-btn');

  // Auto-popup after 2.5 s
  setTimeout(showMascot, 2500);

  close.addEventListener('click', () => {
    wrap.classList.remove('show');
    btn.style.display = 'block';
  });
})();

/* ────────────────────────────────────────────────────────────────────────────
   🔒  DOUBLE-CLICK SECRET (download PDF is already visible; this is reserved
   for future admin expansions — kept for your requirement spec).
   Double-clicking anywhere on the page triggers a brief glow on the glass panel.
──────────────────────────────────────────────────────────────────────────── */
(function initSecretDblClick() {
  let clicks = 0, timer;
  document.addEventListener('click', () => {
    clicks++;
    clearTimeout(timer);
    timer = setTimeout(() => { clicks = 0; }, 400);
    if (clicks >= 2) {
      clicks = 0;
      const panel = document.getElementById('mainPanel');
      panel.style.boxShadow = '0 0 0 3px #4f46e5, 0 20px 60px rgba(79,70,229,.25)';
      setTimeout(() => { panel.style.boxShadow = ''; }, 1000);
      showToast('✨ Admin mode unlocked', false);
    }
  });
})();

/* ────────────────────────────────────────────────────────────────────────────
   🤖  AI REASONING ENGINE
   Pure client-side heuristic analysis of the pendency data.
   No external API call — uses statistical patterns, concentration analysis,
   and data-quality signals to produce actionable chips.
──────────────────────────────────────────────────────────────────────────────
   Logic applied (in order of priority):
   1. Concentration risk  — if top-3 stores hold ≥40% of city pendency
   2. Zero-movement flag  — stores/coaches with large pendency but no progress
   3. FC attribution gap  — how much pendency is unattributed
   4. Volume signal       — absolute count vs. threshold
──────────────────────────────────────────────────────────────────────────── */
function computeAI(pendencyRows, totalCount, isCoach) {
  if (!pendencyRows.length || !totalCount) return [];

  const chips = [];

  // Build aggregated view
  const byEntity = new Map();
  pendencyRows.forEach(r => {
    const key = isCoach ? (r.fleetCoach || 'FC Name Missing') : r.darkStore || 'Unassigned';
    byEntity.set(key, (byEntity.get(key) || 0) + 1);
  });
  const sorted = [...byEntity.entries()].sort(([,a],[,b]) => b - a);

  // 1. Concentration
  if (sorted.length >= 3) {
    const top3 = sorted.slice(0, 3);
    const top3Count = top3.reduce((s, [, c]) => s + c, 0);
    const pct = Math.round((top3Count / totalCount) * 100);
    if (pct >= 40) {
      chips.push({ tone: 'warn', icon: '⚠️', text: `${pct}% of pendency concentrated in just 3 ${isCoach ? 'coaches' : 'stores'} — clear them first` });
    }
  }

  // 2. Top entity callout
  if (sorted.length) {
    const [topName, topCount] = sorted[0];
    const pct = Math.round((topCount / totalCount) * 100);
    chips.push({ tone: 'info', icon: '🏪', text: `${topName} leads with ${topCount} pending (${pct}% of total)` });
  }

  // 3. FC attribution gap
  const missingFC = byEntity.get('FC Name Missing') || byEntity.get('FC Name Missing') || 0;
  if (!isCoach && missingFC > 0) {
    const pct = Math.round((missingFC / totalCount) * 100);
    chips.push({ tone: pct > 15 ? 'warn' : 'info', icon: '🔍', text: `${pct}% of records have no Fleet Coach assigned — check source sheet` });
  }

  // 4. Volume signal
  if (totalCount > 200) chips.push({ tone: 'warn', icon: '📈', text: `High volume: ${totalCount} pending. Consider prioritizing by store capacity.` });
  else if (totalCount < 20) chips.push({ tone: 'good', icon: '✅', text: `Low pendency (${totalCount}) — great progress! Keep the momentum.` });

  // 5. Spread signal
  const entityCount = byEntity.size;
  if (entityCount > 0) {
    const avg = Math.round(totalCount / entityCount);
    chips.push({ tone: 'info', icon: '📊', text: `Avg ${avg} pending per ${isCoach ? 'coach' : 'store'} across ${entityCount} ${isCoach ? 'coaches' : 'stores'}` });
  }

  return chips.slice(0, 4);
}

function renderAI(rows, total, isCoach) {
  const panel = document.getElementById('aiPanel');
  const chips = computeAI(rows, total, isCoach);
  if (!chips.length) { panel.style.display = 'none'; return; }

  const toneClass = { warn: 'ai-warn', good: 'ai-good', info: 'ai-info' };
  document.getElementById('aiChips').innerHTML = chips
    .map(c => `<div class="ai-chip ${toneClass[c.tone]}">${c.icon} ${c.text}</div>`)
    .join('');
  panel.style.display = 'block';
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, isError = false) {
  const container = document.getElementById('toast-container');
  const txt = document.getElementById('toastText');
  txt.textContent = msg;
  txt.style.background = isError ? '#ef4444' : '#1e1b4b';
  container.style.display = 'block';
  setTimeout(() => { container.style.display = 'none'; }, 2500);
}

// ── Loader ─────────────────────────────────────────────────────────────────
let loaderDismissed = false;
function hideLoader() {
  if (loaderDismissed) return;
  loaderDismissed = true;
  const loader = document.getElementById('loading-overlay');
  loader.classList.add('slide-up');
  setTimeout(() => { loader.style.display = 'none'; }, 550);
}

// ── Selectors ──────────────────────────────────────────────────────────────
function initSelectors() {
  const cityEl  = document.getElementById('citySelect');
  const storeEl = document.getElementById('storeSelect');
  cityEl.innerHTML = '<option value="">Search / Select City</option>';
  [...new Set(db.map(r => r.city))].sort().forEach(c => cityEl.add(new Option(c, c)));
  cityEl.disabled = false;
  storeEl.disabled = false;

  if (!cityCtrl) {
    cityCtrl = new TomSelect('#citySelect', { create:false, sortField:{field:'text',direction:'asc'}, maxOptions:100, onChange:handleCityChange });
  } else {
    cityCtrl.clearOptions(); cityCtrl.clear(true);
    [...new Set(db.map(r => r.city))].sort().forEach(c => cityCtrl.addOption({ value:c, text:c }));
    cityCtrl.refreshOptions(false);
  }
  if (!storeCtrl) {
    storeCtrl = new TomSelect('#storeSelect', { create:false, sortField:{field:'text',direction:'asc'}, maxOptions:100, onChange:updateTable });
    storeCtrl.disable();
  }
}

// ── Data loading ───────────────────────────────────────────────────────────
async function loadData() {
  try {
    await WM.fetchWithCache(`${API_URL}?action=pendency`, 'wm:pendency', (payload, fromCache) => {
      db = payload.records || [];
      initSelectors();
      if (!fromCache) hideLoader();
    });
    hideLoader();
  } catch (err) {
    hideLoader();
    showToast(err.message || 'Failed to load data from server.', true);
  }
}

// ── Mode toggle ────────────────────────────────────────────────────────────
function setMode(isCoach) {
  coachMode = isCoach;
  document.getElementById('btnNormal').classList.toggle('mode-active', !isCoach);
  document.getElementById('btnCoach').classList.toggle('mode-active', isCoach);
  document.getElementById('storeWrapper').style.display = isCoach ? 'none' : 'block';
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('aiPanel').style.display = 'none';
  if (cityCtrl) cityCtrl.clear(true);
  if (storeCtrl) { storeCtrl.clear(true); storeCtrl.clearOptions(); storeCtrl.disable(); }
}

// ── City change ────────────────────────────────────────────────────────────
function handleCityChange(c) {
  document.getElementById('resultArea').style.display = 'none';
  document.getElementById('aiPanel').style.display = 'none';
  if (!c) return;
  if (coachMode) { updateTable(); return; }
  storeCtrl.clear(true); storeCtrl.clearOptions();
  [...new Set(db.filter(r => r.city === c).map(r => r.darkStore))].sort()
    .forEach(s => storeCtrl.addOption({ value:s, text:s }));
  storeCtrl.enable();
}

// ── Table update ───────────────────────────────────────────────────────────
function updateTable() {
  const c = cityCtrl.getValue(), s = storeCtrl.getValue();
  if (!c || (!coachMode && !s)) return;

  filtered = coachMode
    ? db.filter(r => r.city === c)
    : db.filter(r => r.city === c && r.darkStore === s);

  if (coachMode) {
    const sum = new Map();
    filtered.forEach(r => {
      const key = r.fleetCoach || 'FC Name Missing';
      sum.set(key, (sum.get(key) || 0) + 1);
    });
    displayArray = [...sum.entries()].sort(([a],[b]) => a.localeCompare(b)).map(([name,cnt]) => ({ name, cnt }));
  } else {
    displayArray = filtered;
  }

  document.getElementById('countBadge').textContent = filtered.length;
  const empty = filtered.length === 0;
  document.getElementById('dlSheet').disabled = empty;
  document.getElementById('dlPdf').disabled   = empty;

  // AI reasoning on selection
  renderAI(filtered, filtered.length, coachMode);

  currentPage = 1;
  renderPage();
}

// ── Render page ────────────────────────────────────────────────────────────
function renderPage() {
  const totalPages = Math.ceil(displayArray.length / ROWS_PER_PAGE) || 1;
  const start = (currentPage - 1) * ROWS_PER_PAGE;
  const chunk = displayArray.slice(start, start + ROWS_PER_PAGE);
  const head  = document.getElementById('tableHead');
  const body  = document.getElementById('tableBody');

  if (filtered.length === 0) {
    head.innerHTML = '';
    body.innerHTML = '<tr><td colspan="2" style="padding:40px">' +
      '<h4 style="font-weight:800;color:#059669;margin:0">🎉 All Clear!</h4>' +
      '<p style="margin-top:5px;font-weight:700;color:#64748b">No pending items for this selection.</p>' +
      '</td></tr>';
    document.getElementById('resultArea').style.display = 'flex';
    document.getElementById('paginationControls').style.display = 'none';
    return;
  }

  const frag = document.createDocumentFragment();
  if (coachMode) {
    head.innerHTML = '<tr><th>Fleet Coach</th><th>Total Pendency</th></tr>';
    chunk.forEach(r => {
      const tr  = document.createElement('tr');
      const nc  = document.createElement('td');
      if (r.name === 'FC Name Missing') nc.innerHTML = '<span class="fc-missing-pill">FC Name Missing</span>';
      else nc.textContent = r.name;
      const cc  = document.createElement('td');
      cc.innerHTML = `<span class="badge-count">${r.cnt}</span>`;
      tr.append(nc, cc); frag.appendChild(tr);
    });
  } else {
    head.innerHTML = '<tr><th style="width:50%">WM Name</th><th style="width:50%">Shipsy ID</th></tr>';
    chunk.forEach(r => {
      const tr = document.createElement('tr');
      const nc = document.createElement('td'); nc.textContent = r.name;
      const ic = document.createElement('td'); ic.style.textTransform = 'none'; ic.textContent = r.shipsyId;
      tr.append(nc, ic); frag.appendChild(tr);
    });
  }
  body.textContent = '';
  body.appendChild(frag);
  document.getElementById('resultArea').style.display = 'flex';

  const pgCtrl = document.getElementById('paginationControls');
  if (displayArray.length > ROWS_PER_PAGE) {
    pgCtrl.style.display = 'flex';
    document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('btnPrev').disabled = currentPage === 1;
    document.getElementById('btnNext').disabled = currentPage === totalPages;
  } else {
    pgCtrl.style.display = 'none';
  }
}

function changePage(dir) {
  const totalPages = Math.ceil(displayArray.length / ROWS_PER_PAGE) || 1;
  currentPage = Math.max(1, Math.min(totalPages, currentPage + dir));
  renderPage();
  document.querySelector('.table-responsive').scrollTop = 0;
}

// ── Export ─────────────────────────────────────────────────────────────────
function doExport(type) {
  if (!filtered.length) return;
  const city     = cityCtrl.getValue();
  const name     = coachMode ? `${city} Coach Summary` : storeCtrl.getValue();
  const btnSheet = document.getElementById('dlSheet');
  const btnPdf   = document.getElementById('dlPdf');
  btnSheet.disabled = true; btnPdf.disabled = true;

  if (type === 'pdf') {
    const orig = btnPdf.textContent;
    btnPdf.textContent = 'Generating PDF…';
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pw  = doc.internal.pageSize.getWidth();
    doc.setFont('times','bold').setFontSize(14).text(`${name} Report`, pw/2, 15, { align:'center' });
    doc.autoTable({
      head: coachMode ? [['FLEET COACH','DARK STORE','WM NAME','SHIPSY ID']] : [['NAME','SHIPSY ID']],
      body: coachMode ? filtered.map(r=>[r.fleetCoach,r.darkStore,r.name,r.shipsyId]) : filtered.map(r=>[r.name,r.shipsyId]),
      startY:25, theme:'grid',
      styles:{ halign:'center', fontSize:8, font:'times', lineColor:[0,0,0] },
      headStyles:{ fillColor:[253,253,150], textColor:[0,0,0] }
    });
    doc.save(`${name}.pdf`);
    btnPdf.textContent = orig; btnSheet.disabled = false; btnPdf.disabled = false;
  } else {
    const orig = btnSheet.textContent;
    const win  = window.open('','_blank');
    btnSheet.textContent = 'Creating Sheet…';
    fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ action:'createExport', criteria:{ mode:coachMode?'coach':'store', city, darkStore:storeCtrl.getValue() } })
    })
    .then(r=>r.json())
    .then(res => {
      btnSheet.textContent = orig; btnSheet.disabled = false; btnPdf.disabled = false;
      if (res.error) { showToast(res.error, true); if (win) win.close(); return; }
      if (win) win.location.href = res.url; else window.open(res.url,'_blank');
    })
    .catch(() => {
      if (win) win.close();
      btnSheet.textContent = orig; btnSheet.disabled = false; btnPdf.disabled = false;
      showToast('Server connection failed.', true);
    });
  }
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
