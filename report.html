<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WM Daily Completion Dashboard</title>
<meta name="description" content="WM Daily Completion Dashboard — city, fleet coach, and dark store wise training completion report.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" type="image/png" href="https://disprz.ai/hubfs/Favicon_64%20px%20reverse-final%20(2).png">
<style>
  html,body{scrollbar-width:none!important;-ms-overflow-style:none!important}
  ::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}
  :root{--primary:#4f46e5;--ink:#000}
  body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#e0e7ff 0%,#f8fafc 100%);color:var(--ink);min-height:100vh;margin:0;padding:20px 15px 30px}
  .wm-shell,.wm-shell *{text-align:center}
  .wm-shell{text-transform:capitalize}

  /* ── Nav ──────────────────────────────────────────────────────────────────── */
  .top-nav{display:flex;justify-content:center;gap:15px;margin-bottom:25px;position:relative;z-index:50}
  .btn-nav{background:rgba(255,255,255,.7);border:2px solid #e2e8f0;border-radius:50px;padding:8px 24px;font-weight:800;font-size:14px;cursor:pointer;transition:.3s;color:var(--ink);text-decoration:none;display:inline-block}
  .btn-nav:hover,.btn-nav.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ── Loading overlay ──────────────────────────────────────────────────────── */
  #loading-overlay{position:fixed;inset:0;background:rgba(224,231,255,.95);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .5s cubic-bezier(.8,0,.2,1);backdrop-filter:blur(5px)}
  .skeleton-box{background:rgba(255,255,255,.6);border-radius:12px;margin-bottom:20px;animation:pulse-bg 1.5s infinite ease-in-out}
  @keyframes pulse-bg{0%{opacity:.5}50%{opacity:1}100%{opacity:.5}}
  .slide-up{transform:translateY(-100%)}
  .spinner{width:50px;height:50px;border:5px solid #fff;border-top:5px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text-anim{font-weight:800;font-size:18px;letter-spacing:1px}

  /* ── Glass panel ──────────────────────────────────────────────────────────── */
  .glass-panel{background:rgba(255,255,255,.95);padding:25px;border-radius:20px;box-shadow:0 15px 40px rgba(0,0,0,.1);max-width:900px;margin:0 auto;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.7);position:relative}

  /* ── Report container ─────────────────────────────────────────────────────── */
  #report-container{max-width:850px;margin:0 auto;display:none}
  .pdf-safe-chunk{page-break-inside:avoid!important;break-inside:avoid!important;margin-bottom:2rem;border-radius:12px;overflow:hidden;border:1px solid #cbd5e1;box-shadow:0 4px 6px rgba(0,0,0,.02)}

  /* ── Table colours ────────────────────────────────────────────────────────── */
  .bg-section-head{background-color:#e0e7ff!important}
  .bg-city,.bg-store,.bg-coach{background-color:#f1f5f9!important}
  .bg-pendency{background-color:#fee2e2!important}
  .bg-completion{background-color:#dcfce3!important}
  .bg-total-row td{background-color:#cbd5e1!important}
  .alert-red{background-color:#fee2e2!important}
  .normal-white{background-color:#fff!important}

  /* ── Table base ───────────────────────────────────────────────────────────── */
  table{width:100%;border-collapse:collapse!important;background:#fff;border:1px solid #cbd5e1!important;box-sizing:border-box;margin-bottom:0}
  th,td{border:1px solid #cbd5e1!important;text-align:center;vertical-align:middle;color:#000!important}
  .table-title{font-size:14px!important;padding:12px!important;border-bottom:2px solid #cbd5e1!important}
  th{font-weight:800;font-size:12px;padding:12px 8px}
  td{font-weight:700;font-size:11px;padding:10px}
  tfoot td{font-weight:800;font-size:12px}

  /* ── Toolbar ──────────────────────────────────────────────────────────────── */
  #btn-container{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px;max-width:900px;margin:0 auto 20px}
  .btn-pdf{background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s;border:none;gap:8px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
  .btn-pdf:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 12px rgba(0,0,0,.15)}
  .btn-pdf:disabled{opacity:.5;cursor:not-allowed}
  select{appearance:none;border-radius:10px!important;padding:12px 20px!important;border:2px solid #e2e8f0!important;font-weight:800;color:#000;cursor:pointer;outline:none;transition:.3s}
  select:focus{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(79,70,229,.15)}

  /* ── Toast ────────────────────────────────────────────────────────────────── */
  #toast-container{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:9999;display:none}
  .toast-msg{background:var(--ink);color:#fff;padding:12px 24px;border-radius:50px;font-weight:800;font-size:14px;box-shadow:0 10px 25px rgba(0,0,0,.3)}

  /* ── Print ────────────────────────────────────────────────────────────────── */
  @media print{
    .no-print{display:none!important}
    body{background:#fff}
    .glass-panel{background:#fff;border:none;box-shadow:none;padding:0}
    #report-container{max-width:100%;padding:10px}
  }
</style>
</head>
<body>
<div id="loading-overlay">
  <div class="skeleton-box" style="width:300px;height:40px"></div>
  <div class="skeleton-box" style="width:600px;height:50px"></div>
  <div class="spinner"></div>
  <div class="loading-text-anim">~ : Welcome :~</div>
</div>

<div class="wm-shell">
  <div class="top-nav">
    <a href="index.html" class="btn-nav">Pendency Dashboard</a>
    <button class="btn-nav active">Daily Completion</button>
  </div>

  <div id="btn-container" class="no-print">
    <select id="col10Filter" onchange="applyFilter()">
      <option value="ALL">All Trainer</option>
    </select>
    <button id="exportBtn" onclick="exportReport()" class="btn-pdf">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
      </svg>
      Export to PDF
    </button>
  </div>

  <div class="glass-panel">
    <div id="report-container">
      <div id="cityContainer"></div>
      <div id="coachContainer"></div>
      <div class="html2pdf__page-break"></div>
      <div id="storeContainer"></div>
    </div>
  </div>
</div>

<div id="toast-container"><div class="toast-msg" id="toastText"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js" defer></script>
<script src="wm-shared.js" defer></script>
<script defer>
  const API_URL = "https://script.google.com/macros/s/AKfycbzCApky64d1Texcqaq67XP57rSRULR7RUnsqrYatGTjsHX7AW-ArAN5jO-59nSRFEVy/exec";

  // ── State ────────────────────────────────────────────────────────────────────
  let reportData = null;
  let loaderDismissed = false;

  // ── Loader ───────────────────────────────────────────────────────────────────
  function hideLoader() {
    if (loaderDismissed) return;
    loaderDismissed = true;
    const loader = document.getElementById('loading-overlay');
    loader.classList.add('slide-up');
    setTimeout(() => { loader.style.display = 'none'; }, 550);
  }

  // ── Toast ────────────────────────────────────────────────────────────────────
  function showToast(msg, isError = false) {
    const container = document.getElementById('toast-container');
    const txt = document.getElementById('toastText');
    txt.textContent = msg;
    txt.style.background = isError ? '#ef4444' : '#000';
    container.style.display = 'block';
    setTimeout(() => { container.style.display = 'none'; }, 2500);
  }

  // ── Data loading ─────────────────────────────────────────────────────────────
  /**
   * The trainer filter is resolved server-side, so changing it re-fetches.
   * Each trainer+ALL combination gets its own cache key so switching is instant
   * on a second visit within the TTL window.
   */
  async function loadData() {
    const trainer = document.getElementById('col10Filter').value || 'ALL';
    const url = `${API_URL}?action=completion&trainer=${encodeURIComponent(trainer)}`;
    const cacheKey = `wm:completion:${trainer}`;
    try {
      await WM.fetchWithCache(url, cacheKey, (data, fromCache) => {
        processData(data);
        if (!fromCache) hideLoader();
      });
      hideLoader();
    } catch (err) {
      showToast(err.message || 'Error loading data', true);
      hideLoader();
    }
  }

  // ── Process & render ─────────────────────────────────────────────────────────
  function processData(data) {
    reportData = data;
    const filter = document.getElementById('col10Filter');
    const selected = data.selectedTrainer || 'ALL';

    // Rebuild trainer options without flicker
    filter.replaceChildren();
    filter.add(new Option('All Trainer', 'ALL'));
    (data.trainers || []).forEach(t => filter.add(new Option(t, t)));
    filter.value = [...filter.options].some(o => o.value === selected) ? selected : 'ALL';

    const threshold = data.alertThreshold || 10;
    renderTable('cityContainer',  'City Wise Completion Report',   'City Name',       'bg-city',  data.summary.city.rows,   data.summary.city.totals,  threshold);
    renderTable('coachContainer', 'Fleet Coach Wise Report',       'Fleet Coach',     'bg-coach', data.summary.coach.rows,  data.summary.coach.totals, threshold);
    renderTable('storeContainer', 'Store Wise Completion Report',  'Dark Store Name', 'bg-store', data.summary.store.rows,  data.summary.store.totals, threshold);

    document.getElementById('report-container').style.display = 'block';
  }

  function applyFilter() { loadData(); }

  // ── Table renderer ────────────────────────────────────────────────────────────
  const ROWS_PER_CHUNK = 35;

  function renderTable(containerId, title, colHeader, colHeaderClass, dataArray, totals, threshold) {
    const container = document.getElementById(containerId);

    if (!dataArray.length) {
      container.innerHTML =
        `<div class="pdf-safe-chunk"><table>` +
        `<thead><tr><th colspan="3" class="table-title bg-section-head">${title}</th></tr>` +
        `<tr><th class="${colHeaderClass}" style="width:40%">${colHeader}</th>` +
        `<th class="bg-pendency" style="width:30%">Total Pendency</th>` +
        `<th class="bg-completion" style="width:30%">Today's Completion</th></tr></thead>` +
        `<tbody><tr><td colspan="3" style="padding:20px;font-weight:800">No data available for this selection.</td></tr></tbody>` +
        `</table></div>`;
      return;
    }

    // Build all chunks; use string concatenation (fast for many small tables)
    let html = '';
    for (let i = 0; i < dataArray.length; i += ROWS_PER_CHUNK) {
      const chunk = dataArray.slice(i, i + ROWS_PER_CHUNK);
      const isFirst = i === 0;
      const isLast  = i + ROWS_PER_CHUNK >= dataArray.length;

      let t = '<div class="pdf-safe-chunk"><table><thead>';
      if (isFirst) t += `<tr><th colspan="3" class="table-title bg-section-head">${title}</th></tr>`;
      t += `<tr><th class="${colHeaderClass}" style="width:40%">${colHeader}</th>` +
           `<th class="bg-pendency" style="width:30%">Total Pendency</th>` +
           `<th class="bg-completion" style="width:30%">Today's Completion</th></tr></thead><tbody>`;

      chunk.forEach(item => {
        const cls = item.completion < threshold ? 'alert-red' : 'normal-white';
        const nameHtml = item.name === 'FC Name Missing'
          ? '<span style="background:#fee2e2;color:#b91c1c;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800;border:1px solid #fca5a5;display:inline-block">FC Name Missing</span>'
          : WM.escapeHtml(item.name);
        t += `<tr><td>${nameHtml}</td><td>${item.pendency}</td><td class="${cls}">${item.completion}</td></tr>`;
      });

      t += '</tbody>';
      if (isLast) {
        t += `<tfoot><tr class="bg-total-row"><td>TOTAL</td><td>${totals.pendency}</td><td>${totals.completion}</td></tr></tfoot>`;
      }
      t += '</table></div>';
      html += t;
      if (!isLast) html += '<div class="html2pdf__page-break"></div>';
    }
    container.innerHTML = html;
  }

  // ── PDF export ───────────────────────────────────────────────────────────────
  function exportReport() {
    const element = document.getElementById('report-container');
    const btn = document.getElementById('exportBtn');
    const orig = btn.innerHTML;
    btn.textContent = 'Generating PDF…';
    btn.disabled = true;
    html2pdf()
      .set({
        margin: [0.4, 0.4, 0.4, 0.4],
        filename: 'WM_Completion_Report.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: 'css' }
      })
      .from(element)
      .save()
      .finally(() => {
        btn.innerHTML = orig;
        btn.disabled = false;
      });
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
